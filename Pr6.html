<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота №2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #000000;
            text-align: center;
            padding: 20px;
        }
        .result {
            text-align: left;
            margin-left: 20px;
        }
        .result-value {
            color: #a72828;
            font-weight: bold;
        }
        .calculator {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        h2, h3 {color: #000000;}
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            font-weight: bold;
        }
        input {
            width: 150px;
            padding: 8px;
            border: 1px solid #494848;
            border-radius: 5px;
            font-size: 16px;
            text-align: right;
        }
        button {
            background:  #000000;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>калькулятор для розрахунку електричних навантажень об’єктів</h2>
    <label>Номінальна потужність шліфувального верстату  (кВт): <input type="number" id="1" value="20"></label>
    <label>Коефіцієнт використання полірувального верстату : <input type="number" id="2" value="0.2"></label>
    <label>Коефіцієнт реактивної потужності циркулярної пили : <input type="number" id="3" value="1.52"></label>
    <button onclick="calculate()">Обрахувати</button>
    <div class="result" id="res"></div>
</div>
<script src="Pr6.js"></script>
</body>
</html>
